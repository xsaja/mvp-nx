# MVP Baseball 2005 para Switch - ajustes (este archivo va junto a mvp05.nro, en sdmc:/switch/mvp05/)
# Si lo borras, el juego usa estos mismos valores por defecto.
# En Switch no hay display_mode, width ni height: la resolucion es la de la pantalla
# (1280x720 en portatil, 1920x1080 en la base).

# Resolucion interna en % de la altura de la pantalla (100 = nativa). Bajalo (por ejemplo 75) si va lento.
render_percent = 100

# Fotogramas por segundo maximos (0 = sin limite). 30 por defecto; prueba 60 si quieres: el log
# escribe cada 10 s los fps reales (lineas "perf:").
fps_cap = 30

# Sincronia vertical (evita cortes en la imagen).
vsync = true

# true (por defecto, como en el paquete de Windows de MVP): el juego cree que la tele es HDTV 720p.
xbox_720p = true

# Filtrado anisotropico: 0 = lo que pida el juego; 2, 4, 8 o 16 para forzarlo.
anisotropic_filtering = 0

# Botones A/B/X/Y: false (por defecto) = por posicion, como un mando de Xbox (B abajo = A de Xbox,
# A derecha = B, Y izquierda = X, X arriba = Y; en el diamante de bases X = segunda, B = home,
# A = primera, Y = tercera). true = por letra (A = A de Xbox).
buttons_by_name = false

# Relojes en MHz (0 = los de la consola, sin tocar). Se aplican al arrancar y al poner o quitar la base, y
# se devuelven los de la consola al salir. Tope: CPU 1785, GPU 921, memoria 1600 (los maximos oficiales).
# De serie: CPU 1020; GPU 307-460 en portatil y 768 en la base; memoria 1331 en portatil y 1600 en la base.
# Subirlos gasta mas bateria y calienta mas. Ejemplo para probar: cpu_mhz = 1785
cpu_mhz = 0
gpu_mhz = 0
mem_mhz = 0

# Rendimiento: true (por defecto) = el juego copia los vertices de cada dibujo al hacerlo y no espera
# al hilo de graficos. false = espera en cada dibujo, como el arreglo original de MVP (mas lento).
# Si ves figuras rotas o parpadeos raros, pon false y avisame.
draw_copy = true

# Rendimiento: true (por defecto) = si un dibujo usa las mismas constantes que el anterior, se reutilizan
# en vez de volver a subirlas a la GPU. false = subirlas siempre (como antes).
reuse_constants = true

# Rendimiento (prueba): microsegundos que el hilo del juego y el de graficos se esperan "despiertos"
# antes de dormirse. 0 = dormir enseguida. Con draw_copy = true casi no hace falta.
render_spin_us = 0

# true (por defecto): muestra los FPS y la resolucion en Status Monitor Overlay / Horizon OC Monitor,
# y obedece el modo portatil/base que elijas en ReverseNX-RT. Necesita SaltyNX 0.7.0 o posterior;
# sin SaltyNX no hace nada.
saltynx = true
